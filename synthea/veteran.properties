# Synthea settings for the veteran test population (see openspec/changes/veteran-test-population).
# Run from the synthea/ folder: java -jar bin/synthea-with-dependencies.jar -c veteran.properties ...
exporter.baseDirectory = ./output/
exporter.years_of_history = 0
exporter.fhir.export = true
exporter.hospital.fhir.export = false
exporter.practitioner.fhir.export = false
# The loader does not use these; dropping them cuts each bundle to roughly a third.
exporter.fhir.excluded_resources = Claim,ExplanationOfBenefit,DocumentReference,ImagingStudy
# Living patients only; the veteran module then makes every patient a veteran.
generate.only_alive_patients = true
generate.veteran_population_override = true
